[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopfloor-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants read and schedule manufacturing work orders safely."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sachin Gujjar" }]
dependencies = ["mcp>=2.0", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shopfloor-mcp = "shopfloor_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shopfloor_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
